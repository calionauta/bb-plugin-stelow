name: sync Stelow

on:
  repository_dispatch:
    types: [stelow-release]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-stelow
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: calionauta/stelow
          ref: ${{ github.event.client_payload.commit || 'main' }}
          path: upstream
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize one immutable upstream revision
        run: |
          test -z "$(git -C upstream status --porcelain)"
          UPSTREAM_SHA="$(git -C upstream rev-parse HEAD)"
          test "${#UPSTREAM_SHA}" = 40
          test -f upstream/scripts/stelow
          test -f upstream/product-strategies.json
          test -f upstream/package.json
          test "$(find upstream/skills -mindepth 1 -maxdepth 1 -type d -name 'stelow-*' | wc -l)" -gt 0
          find skills -mindepth 1 -maxdepth 1 -type d -name 'stelow-*' -exec rm -rf {} +
          cp -a upstream/skills/. skills/
          cp upstream/scripts/stelow data/stelow
          cp upstream/product-strategies.json data/product-strategies.json
          cp upstream/package.json data/stelow-package.json
          # The catalog copies under data/ are DERIVED from the synced skills by
          # lib/workflow-skills-sync.mjs (SINGLE_FILES), and the board reads them
          # at module load — so a sync that refreshed skills/ but not these left
          # the UI a release behind. That is how the phase rename shipped
          # upstream and still rendered as the old label here.
          # All three are `optional` there: a pin predating the generated
          # catalogs must preserve the local copy, not fail the sync.
          for pair in \
            "skills/stelow-workflow-orchestrator/stage-catalog.json:data/stelow-stage-catalog.json" \
            "skills/stelow-workflow-orchestrator/recipe-catalog.json:data/stelow-recipe-catalog.json" \
            "recipes.schema.json:data/stelow-recipes.schema.json"; do
            src="upstream/${pair%%:*}"; dst="${pair##*:}"
            if [ -f "$src" ]; then cp "$src" "$dst"; fi
          done
          UPSTREAM_SHA="$UPSTREAM_SHA" node --input-type=module -e 'import { readFileSync, writeFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("upstream/package.json", "utf8")); if (typeof pkg.version !== "string") throw new Error("upstream package has no version"); writeFileSync("data/stelow-source.json", JSON.stringify({ version: pkg.version, commit: process.env.UPSTREAM_SHA }, null, 2) + "\n");'
      - name: Verify the candidate
        run: |
          npm ci
          npm run typecheck
          npm test
          npm pack --dry-run --json >/dev/null
      - name: Open or update the synchronization pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then exit 0; fi
          SHA="$(node -p 'require("./data/stelow-source.json").commit')"
          VERSION="$(node -p 'require("./data/stelow-source.json").version')"
          BRANCH="automation/stelow-${SHA:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/stelow data/product-strategies.json data/stelow-package.json data/stelow-source.json data/stelow-stage-catalog.json data/stelow-recipe-catalog.json data/stelow-recipes.schema.json skills
          git commit -m "chore: sync Stelow ${VERSION}"
          git push --force-with-lease origin "$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --base master --head "$BRANCH" --title "chore: sync Stelow ${VERSION}" --body "Automated, immutable sync from calionauta/stelow@${SHA}. The workflow ran typecheck, tests, and package verification. Review and merge; releases remain explicit."
          fi
