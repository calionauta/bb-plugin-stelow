name: release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      # Cut a release by hand when a change is correctly typed but still has
      # to ship. `refactor:` is documented as never bumping the version, which
      # is right for a tidy-up and wrong for a 246-commit restructuring that
      # moves artifact reads and preset migration. Such a merge would leave
      # every install on the old version with no release to move to, and the
      # only escape would be a fabricated commit whose type lies about intent.
      release-as:
        description: "Version to release, e.g. 0.52.0. Empty behaves as a normal run."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
          # Empty string is release-please's own "no opinion"; passing an empty
          # input keeps the automatic path identical to having no input at all.
          release-as: ${{ inputs.release-as }}
